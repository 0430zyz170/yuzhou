function initAudio(){if(!audioCtx)audioCtx=new AudioContext();if(audioCtx.state==='suspended')audioCtx.resume();}
function playTone(freq,dur=0.15,type='sine',vol=0.07){if(!soundEnabled)return;try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}}

    str += i<affection ? map[Math.min(i+1,4)] : '⚫';
  }
  document.getElementById('affectionDisplay').textContent=str;
}
function changeAffection(d){affection=Math.max(0,Math.min(MAX_AFF,affection+d));updateAffectionDisplay();}

// ==================== 状态 ====================
let currentNodeId="start";
const speakerNameEl=document.getElementById('speakerName');
const dialogueTextEl=document.getElementById('dialogueText');
const optionsContainer=document.getElementById('optionsContainer');
const sceneArea=document.getElementById('sceneArea');
const avatarImg=document.getElementById('avatarImg');
const avatarDefault=document.getElementById('avatarDefault');
const memoryToast=document.getElementById('memoryToast');
const soundToggle=document.getElementById('soundToggle');
const chapterInfo=document.getElementById('chapterInfo');
const affectionDisplay=document.getElementById('affectionDisplay');
const bgUpload=document.getElementById('bgUpload');
const avatarUpload=document.getElementById('avatarUpload');
const saveBtn=document.getElementById('saveBtn');
const loadBtn=document.getElementById('loadBtn');
const STORAGE_KEY='yuzhou_memory_save_v6';

// ==================== 渲染 ====================
function renderNode(nodeId){
  const node=story[nodeId];
  if(!node){console.warn('节点不存在');return renderNode('start');}
  currentNodeId=nodeId;
  if(node.chapter)chapterInfo.textContent=node.chapter;
  speakerNameEl.textContent=node.speaker||'张泽禹';
  dialogueTextEl.textContent=node.text||'';
  optionsContainer.innerHTML='';
  node.options.forEach((opt,idx)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';
    const ls=document.createElement('span');
    ls.className='opt-letter';
    ls.textContent=String.fromCharCode(65+idx);
    const ts=document.createElement('span');
    ts.textContent=opt.text;
    btn.appendChild(ls);btn.appendChild(ts);
    btn.addEventListener('click',()=>{
      playTone(523.25,0.1,'sine',0.06);
      if(opt.affection)changeAffection(opt.affection);
      if(opt.next==='happyEnd'&&affection>=4)setTimeout(()=>playTone(784,0.3,'sine',0.1),200);
      renderNode(opt.next);
    });
    optionsContainer.appendChild(btn);
  });
  playTone(392,0.08,'sine',0.04);
}

// ==================== 存档 ====================
function saveMemory(){
  const bg=sceneArea.style.backgroundImage;
  const av=avatarImg.src;
  const hasAv=avatarImg.style.display!=='none'&&avatarImg.src!=='';
  const mem={currentNodeId,backgroundImage:bg,avatarSrc:av,showAvatar:hasAv,affection,soundEnabled,timestamp:Date.now()};
  localStorage.setItem(STORAGE_KEY,JSON.stringify(mem));
  memoryToast.textContent='✓ 记忆已封存 · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  setTimeout(()=>{memoryToast.textContent='';},3000);
  playTone(659.25,0.2,'triangle',0.08);
}
function loadMemory(){
  const saved=localStorage.getItem(STORAGE_KEY);
  if(!saved){memoryToast.textContent='✗ 暂无记忆存档';setTimeout(()=>{memoryToast.textContent='';},2000);return;}
  try{
    const m=JSON.parse(saved);
    if(m.currentNodeId&&story[m.currentNodeId])renderNode(m.currentNodeId);else renderNode('start');
    if(m.backgroundImage)sceneArea.style.backgroundImage=m.backgroundImage;
    if(m.avatarSrc&&m.showAvatar){avatarImg.src=m.avatarSrc;avatarImg.style.display='block';avatarDefault.style.display='none';}
    else{avatarImg.style.display='none';avatarDefault.style.display='block';avatarImg.src='';}
    if(typeof m.affection==='number'){affection=m.affection;updateAffectionDisplay();}
    if(typeof m.soundEnabled==='boolean'){soundEnabled=m.soundEnabled;updateSoundUI();}
    memoryToast.textContent='↺ 记忆已读取 · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    setTimeout(()=>{memoryToast.textContent='';},3000);
    playTone(523.25,0.25,'sine',0.08);
  }catch(e){console.error(e);memoryToast.textContent='✗ 记忆损坏';setTimeout(()=>{memoryToast.textContent='';},2000);}
}

// ==================== 音效 UI ====================
function updateSoundUI(){
  soundToggle.innerHTML=soundEnabled?'<span>🔊 音效开启</span>':'<span>🔇 音效关闭</span>';
  if(soundEnabled&&!musicPlaying)startBGM();
  else if(!soundEnabled&&musicPlaying)stopBGM();
}

// ==================== 事件 ====================
bgUpload.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>sceneArea.style.backgroundImage=`url('${ev.target.result}')`;r.readAsDataURL(f);bgUpload.value='';});
avatarUpload.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{avatarImg.src=ev.target.result;avatarImg.style.display='block';avatarDefault.style.display='none';};r.readAsDataURL(f);avatarUpload.value='';});
saveBtn.addEventListener('click',saveMemory);
loadBtn.addEventListener('click',loadMemory);
soundToggle.addEventListener('click',()=>{soundEnabled=!soundEnabled;updateSoundUI();if(soundEnabled)playTone(440,0.15,'sine',0.08);});
document.body.addEventListener('click',function init(){if(!audioCtx){initAudio();if(soundEnabled)startBGM();}document.body.removeEventListener('click',init);},{once:true});

// ==================== 初始化 ====================
renderNode('start');
updateAffectionDisplay();
updateSoundUI();
if(!avatarImg.src||avatarImg.src===''||avatarImg.src===window.location.href){avatarImg.style.display='none';avatarDefault.style.display='block';}
else{avatarImg.style.display='block';avatarDefault.style.display='none';}
})();
</script>
